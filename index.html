<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="theme-color" content="#efebdf" />
	<title>prose-ai</title>
	<!-- pre-paint theme: a stored choice (or OS preference) must land before
	     first paint, or dark users get a paper flash on every load -->
	<script>
		const stored = localStorage.getItem('prose-ai:theme');
		if (stored === 'dark' || (!stored && matchMedia('(prefers-color-scheme: dark)').matches)) {
			document.documentElement.classList.add('dark');
		}
	</script>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/src/css/style.css" />
</head>
<body>

<div id="app">

	<!-- toolbar -->
	<header id="toolbar">
		<span class="wordmark">prose-ai</span>
		<div class="divider"></div>

		<div class="mode-selector">
			<button class="mode-btn active" data-mode="proofread">Proofread</button>
			<button class="mode-btn" data-mode="rewrite">Rewrite</button>
			<button class="mode-btn" data-mode="formalize">Formalize</button>
			<button class="mode-btn" data-mode="concise">Concise</button>
		</div>

		<div class="type-toggles" id="type-toggles">
			<div class="divider"></div>
			<label class="type-toggle active" data-type="grammar">
				<input type="checkbox" value="grammar" checked>
				<span class="dot"></span> grammar
			</label>
			<label class="type-toggle active" data-type="vocabulary">
				<input type="checkbox" value="vocabulary" checked>
				<span class="dot"></span> vocabulary
			</label>
			<label class="type-toggle active" data-type="clarity">
				<input type="checkbox" value="clarity" checked>
				<span class="dot"></span> clarity
			</label>
			<label class="type-toggle active" data-type="tone">
				<input type="checkbox" value="tone" checked>
				<span class="dot"></span> tone
			</label>
		</div>

		<div class="spacer"></div>

		<span id="toolbar-status"></span>
		<button id="btn-theme" aria-pressed="false" aria-label="toggle color scheme">
			<svg class="sunAndMoon" aria-hidden="true" viewBox="1 0 24 24">
				<mask id="moonMask" class="moon">
					<rect fill="white" height="100%" width="100%" x="0" y="0"/>
					<circle cx="0" cy="10" fill="black" r="6"/>
				</mask>
				<circle class="sun" cx="12" cy="12" fill="currentColor" mask="url(#moonMask)" r="6"/>
				<g class="sunBeams" stroke="currentColor">
					<line x1="12" x2="12" y1="1" y2="3"/>
					<line x1="12" x2="12" y1="21" y2="23"/>
					<line x1="4.22" x2="5.64" y1="4.22" y2="5.64"/>
					<line x1="18.36" x2="19.78" y1="18.36" y2="19.78"/>
					<line x1="1" x2="3" y1="12" y2="12"/>
					<line x1="21" x2="23" y1="12" y2="12"/>
					<line x1="4.22" x2="5.64" y1="19.78" y2="18.36"/>
					<line x1="18.36" x2="19.78" y1="5.64" y2="4.22"/>
				</g>
			</svg>
			<kbd id="theme-label">light</kbd>
		</button>
		<button id="btn-undo">undo</button>
		<button id="btn-reflow">reflow</button>
		<button id="btn-cancel">cancel</button>
		<button id="btn-analyze">analyze</button>
	</header>

	<!-- editor -->
	<main id="editor-wrap">
		<div id="editor"></div>
	</main>

	<!-- sidebar -->
	<aside id="sidebar">
		<div id="sidebar-resizer"></div>
		<div id="sidebar-header">
			<h2>Suggestions</h2>
			<span id="suggestion-count">0</span>
		</div>
		<div id="sidebar-list">
			<div id="sidebar-empty">
				<div class="empty-icon">✦</div>
				<p>No suggestions yet.<br>Click analyze to get started.</p>
			</div>
		</div>
	</aside>

</div>

<!-- bubble menu (positioned by tiptap extension) -->
<div id="bubble-menu"></div>

<!-- floating tooltip -->
<div id="tooltip">
	<span id="tooltip-badge" class="sg-badge"></span>
	<p id="tooltip-explanation"></p>
	<p id="tooltip-diff" class="sg-diff"></p>
	<div id="tooltip-actions">
		<button class="sg-btn accept" id="tooltip-accept">accept</button>
		<button class="sg-btn reject" id="tooltip-reject">reject</button>
	</div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
