<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>prose-ai</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
	<style>
		/* ── reset ─────────────────────────────────────────── */
		*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

		/* ── tokens ────────────────────────────────────────── */
		:root {
			--bg:         #0e0e0c;
			--bg-surface: #161614;
			--bg-raised:  #1e1e1b;
			--bg-hover:   #252521;
			--border:     #2a2a26;
			--border-mid: #363630;

			--text:       #ddd8cc;
			--text-mid:   #8a8578;
			--text-dim:   #4a4842;

			--accent:     #c8a96e;        /* warm amber */
			--accent-dim: #6b5a38;

			/* suggestion type colours */
			--sg-grammar:    #e05c5c;
			--sg-grammar-bg: rgba(224, 92, 92, 0.12);
			--sg-vocab:      #5c8de0;
			--sg-vocab-bg:   rgba(92, 141, 224, 0.12);
			--sg-clarity:    #d4a843;
			--sg-clarity-bg: rgba(212, 168, 67, 0.12);
			--sg-tone:       #9b72c8;
			--sg-tone-bg:    rgba(155, 114, 200, 0.12);

			/* inline diff colours */
			--diff-del:    #e05c5c;
			--diff-del-bg: rgba(224, 92, 92, 0.14);
			--diff-ins:    #79b873;
			--diff-ins-bg: rgba(121, 184, 115, 0.16);
			--font-prose: 'Lora', Georgia, serif;
			--font-ui:    'DM Mono', 'Courier New', monospace;

			--radius:  4px;
			--sidebar: 300px;
			--toolbar: 52px;
		}

		/* ── base ──────────────────────────────────────────── */
		html, body {
			height: 100%;
			background: var(--bg);
			color: var(--text);
			font-family: var(--font-ui);
			font-size: 13px;
			line-height: 1.5;
			-webkit-font-smoothing: antialiased;
		}

		/* ── layout ────────────────────────────────────────── */
		#app {
			display: grid;
			grid-template-rows: var(--toolbar) 1fr;
			grid-template-columns: 1fr var(--sidebar);
			grid-template-areas:
				"toolbar toolbar"
				"editor  sidebar";
			height: 100vh;
			overflow: hidden;
		}

		/* ── toolbar ───────────────────────────────────────── */
		#toolbar {
			grid-area: toolbar;
			display: flex;
			align-items: center;
			gap: 16px;
			padding: 0 20px;
			background: var(--bg-surface);
			border-bottom: 1px solid var(--border);
			position: relative;
			z-index: 10;
		}

		#toolbar .wordmark {
			font-family: var(--font-ui);
			font-size: 11px;
			font-weight: 500;
			letter-spacing: 0.15em;
			text-transform: uppercase;
			color: var(--accent);
			margin-right: 8px;
		}

		#toolbar .divider {
			width: 1px;
			height: 20px;
			background: var(--border-mid);
		}

		/* mode selector */
		.mode-selector {
			display: flex;
			gap: 2px;
			background: var(--bg);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			padding: 2px;
		}
		.mode-btn {
			padding: 4px 10px;
			border: none;
			border-radius: 3px;
			background: transparent;
			color: var(--text-mid);
			font-family: var(--font-ui);
			font-size: 11px;
			cursor: pointer;
			transition: all 0.12s;
			white-space: nowrap;
		}
		.mode-btn:hover { color: var(--text); background: var(--bg-hover); }
		.mode-btn.active {
			background: var(--bg-raised);
			color: var(--text);
			border: 1px solid var(--border-mid);
		}

		/* type toggles slide in/out — only visible in proofread mode */
		#type-toggles {
			display: flex;
			align-items: center;
			gap: 6px;
			overflow: hidden;
			max-width: 0;
			opacity: 0;
			transition: max-width 0.2s ease, opacity 0.15s ease;
		}
		#type-toggles.visible {
			max-width: 400px;
			opacity: 1;
		}

		.type-toggle {
			display: flex;
			align-items: center;
			gap: 5px;
			padding: 4px 8px;
			border-radius: var(--radius);
			border: 1px solid var(--border);
			background: transparent;
			color: var(--text-mid);
			font-family: var(--font-ui);
			font-size: 11px;
			cursor: pointer;
			transition: all 0.15s;
			user-select: none;
		}

		.type-toggle input[type="checkbox"] { display: none; }

		.type-toggle.active { color: var(--text); border-color: var(--border-mid); background: var(--bg-raised); }
		.type-toggle[data-type="grammar"].active  { border-color: var(--sg-grammar); color: var(--sg-grammar); background: var(--sg-grammar-bg); }
		.type-toggle[data-type="vocabulary"].active { border-color: var(--sg-vocab); color: var(--sg-vocab); background: var(--sg-vocab-bg); }
		.type-toggle[data-type="clarity"].active  { border-color: var(--sg-clarity); color: var(--sg-clarity); background: var(--sg-clarity-bg); }
		.type-toggle[data-type="tone"].active     { border-color: var(--sg-tone); color: var(--sg-tone); background: var(--sg-tone-bg); }
		.type-toggle .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: 0.7; }

		/* analyze button */
		#toolbar .spacer { flex: 1; }

		#btn-analyze {
			display: flex;
			align-items: center;
			gap: 8px;
			padding: 7px 16px;
			background: var(--accent);
			color: #0e0e0c;
			border: none;
			border-radius: var(--radius);
			font-family: var(--font-ui);
			font-size: 11px;
			font-weight: 500;
			letter-spacing: 0.08em;
			text-transform: uppercase;
			cursor: pointer;
			transition: opacity 0.15s, transform 0.1s;
		}
		#btn-analyze:hover { opacity: 0.88; }
		#btn-analyze:active { transform: scale(0.97); }
		#btn-analyze:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

		#btn-cancel {
			display: none;
			padding: 7px 12px;
			background: transparent;
			color: var(--text-mid);
			border: 1px solid var(--border-mid);
			border-radius: var(--radius);
			font-family: var(--font-ui);
			font-size: 11px;
			cursor: pointer;
			transition: color 0.15s, border-color 0.15s;
		}
		#btn-cancel:hover { color: var(--text); border-color: var(--border-mid); }
		#btn-cancel.visible { display: block; }

		#btn-reflow {
			padding: 7px 12px;
			background: transparent;
			color: var(--text-dim);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			font-family: var(--font-ui);
			font-size: 11px;
			cursor: pointer;
			transition: color 0.15s, border-color 0.15s;
		}
		#btn-reflow:hover {
			color: var(--text);
			border-color: var(--border-mid);
		}
		#btn-reflow:active {
			transform: scale(0.97);
		}
		#btn-reflow:disabled {
			opacity: 0.35;
			cursor: not-allowed;
			transform: none;
		}

		/* status message */
		#toolbar-status {
			font-size: 11px;
			color: var(--text-dim);
			min-width: 120px;
		}
		#toolbar-status.loading { color: var(--accent-dim); }
		#toolbar-status.error   { color: var(--sg-grammar); }
		#toolbar-status.warn    { color: var(--sg-clarity); }

		/* spinner */
		@keyframes spin { to { transform: rotate(360deg); } }
		.spinner {
			width: 10px; height: 10px;
			border: 1.5px solid transparent;
			border-top-color: currentColor;
			border-radius: 50%;
			animation: spin 0.7s linear infinite;
		}

		/* ── editor pane ───────────────────────────────────── */
		#editor-wrap {
			grid-area: editor;
			overflow-y: auto;
			padding: 60px 80px 120px;
			border-right: 1px solid var(--border);
		}

		/* tiptap mounts here */
		#editor {
			max-width: 680px;
			margin: 0 auto;
			outline: none;
		}

		/* prose typography */
		.ProseMirror {
			font-family: var(--font-prose);
			font-size: 18px;
			line-height: 1.75;
			color: var(--text);
			outline: none;
			caret-color: var(--accent);
		}

		.ProseMirror p { margin-bottom: 1.2em; }
		.ProseMirror p:last-child { margin-bottom: 0; }

		.ProseMirror strong { font-weight: 600; }
		.ProseMirror em { font-style: italic; }

		/* placeholder */
		.ProseMirror p.is-editor-empty:first-child::before {
			content: attr(data-placeholder);
			color: var(--text-dim);
			pointer-events: none;
			float: left;
			height: 0;
			font-style: italic;
		}

		/* suggestion marks */
		.suggestion {
			border-radius: 2px;
			cursor: pointer;
			transition: background 0.1s;
			padding: 0 1px;
		}
		.suggestion--grammar  { background: var(--sg-grammar-bg);  border-bottom: 1.5px solid var(--sg-grammar);  }
		.suggestion--vocabulary { background: var(--sg-vocab-bg);  border-bottom: 1.5px solid var(--sg-vocab);    }
		.suggestion--clarity  { background: var(--sg-clarity-bg);  border-bottom: 1.5px solid var(--sg-clarity);  }
		.suggestion--tone     { background: var(--sg-tone-bg);      border-bottom: 1.5px solid var(--sg-tone);     }

		.suggestion:hover { filter: brightness(1.3); }
		.suggestion.active { outline: 1px solid currentColor; outline-offset: 1px; }

		/* ── sidebar ───────────────────────────────────────── */
		#sidebar {
			grid-area: sidebar;
			display: flex;
			flex-direction: column;
			overflow: hidden;
			background: var(--bg-surface);
			position: relative;
		}

		/* drag handle on the sidebar's left edge */
		#sidebar-resizer {
			position: absolute;
			top: 0;
			left: -3px;
			width: 7px;
			height: 100%;
			cursor: col-resize;
			z-index: 20;
			touch-action: none;

			&::after {
				content: "";
				position: absolute;
				top: 0;
				left: 3px;
				width: 1px;
				height: 100%;
				background: transparent;
				transition: background 0.15s;
			}

			&:hover::after,
			&.dragging::after {
				background: var(--accent-dim);
			}
		}

		/* no text selection or editor cursor while dragging */
		body.resizing {
			cursor: col-resize;
			user-select: none;
		}

		#sidebar-header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 14px 16px 12px;
			border-bottom: 1px solid var(--border);
			flex-shrink: 0;
		}

		#sidebar-header h2 {
			font-size: 10px;
			font-weight: 500;
			letter-spacing: 0.15em;
			text-transform: uppercase;
			color: var(--text-mid);
		}

		#suggestion-count {
			font-size: 10px;
			color: var(--text-dim);
			background: var(--bg-raised);
			padding: 2px 6px;
			border-radius: 10px;
		}

		#sidebar-list {
			flex: 1;
			overflow-y: auto;
			padding: 8px;
			display: flex;
			flex-direction: column;
			gap: 4px;
		}

		/* empty state */
		#sidebar-empty {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			flex: 1;
			gap: 8px;
			color: var(--text-dim);
			text-align: center;
			padding: 40px 24px;
		}

		#sidebar-empty .empty-icon {
			font-size: 28px;
			opacity: 0.3;
			margin-bottom: 4px;
		}

		#sidebar-empty p {
			font-size: 11px;
			line-height: 1.6;
		}

		/* suggestion card */
		.sg-card {
			padding: 10px 12px;
			border-radius: var(--radius);
			border: 1px solid var(--border);
			background: var(--bg-raised);
			cursor: pointer;
			transition: border-color 0.15s, background 0.15s;
		}
		.sg-card:hover { background: var(--bg-hover); border-color: var(--border-mid); }
		.sg-card.active { border-color: var(--border-mid); background: var(--bg-hover); }

		.sg-card-header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			margin-bottom: 6px;
		}

		.sg-badge {
			font-size: 9px;
			font-weight: 500;
			letter-spacing: 0.12em;
			text-transform: uppercase;
			padding: 2px 6px;
			border-radius: 3px;
		}
		.sg-badge--grammar    { color: var(--sg-grammar);  background: var(--sg-grammar-bg); }
		.sg-badge--vocabulary { color: var(--sg-vocab);    background: var(--sg-vocab-bg);   }
		.sg-badge--clarity    { color: var(--sg-clarity);  background: var(--sg-clarity-bg); }
		.sg-badge--tone       { color: var(--sg-tone);     background: var(--sg-tone-bg);    }

		.sg-card-actions {
			display: flex;
			gap: 4px;
		}

		.sg-btn {
			padding: 2px 8px;
			border-radius: 3px;
			border: 1px solid var(--border-mid);
			background: transparent;
			color: var(--text-mid);
			font-family: var(--font-ui);
			font-size: 10px;
			cursor: pointer;
			transition: all 0.12s;
		}
		.sg-btn:hover { color: var(--text); border-color: var(--text-dim); }
		.sg-btn.accept:hover { color: var(--accent); border-color: var(--accent-dim); }
		.sg-btn.reject:hover { color: var(--sg-grammar); border-color: var(--sg-grammar); }

		.sg-card-explanation {
			font-size: 11px;
			color: var(--text-mid);
			line-height: 1.5;
			margin-bottom: 6px;
		}

		/* inline diff — unchanged context plain, deletions struck out,
		   insertions highlighted; pre-wrap keeps whitespace-only edits
		   (e.g. "-" → " ") visible */
		.sg-diff {
			font-size: 11px;
			line-height: 1.7;
			color: var(--text-mid);
			white-space: pre-wrap;
			word-break: break-word;

			.diff-del {
				color: var(--diff-del);
				background: var(--diff-del-bg);
				text-decoration: line-through;
				text-decoration-thickness: 1px;
				border-radius: 2px;
				padding: 1px 2px;
			}

			.diff-ins {
				color: var(--diff-ins);
				background: var(--diff-ins-bg);
				border-radius: 2px;
				padding: 1px 2px;
			}
		}

		/* ── tooltip ───────────────────────────────────────── */
		#tooltip {
			position: fixed;
			z-index: 100;
			display: none;
			flex-direction: column;
			gap: 8px;
			padding: 10px 12px;
			background: var(--bg-raised);
			border: 1px solid var(--border-mid);
			border-radius: var(--radius);
			box-shadow: 0 8px 24px rgba(0,0,0,0.4);
			min-width: 220px;
			max-width: 320px;
		}
		#tooltip.visible { display: flex; }

		#tooltip-badge { align-self: flex-start; }
		#tooltip-explanation { font-size: 11px; color: var(--text-mid); line-height: 1.5; }

		#tooltip-actions {
			display: flex;
			gap: 6px;
			padding-top: 4px;
			border-top: 1px solid var(--border);
		}

		/* ── bubble menu ──────────────────────────────────── */
		#bubble-menu {
			display: flex;
			gap: 4px;
			padding: 4px;
			background: var(--bg-raised);
			border: 1px solid var(--border-mid);
			border-radius: var(--radius);
			box-shadow: 0 8px 24px rgba(0,0,0,0.4);
		}

		.bubble-btn {
			display: flex;
			align-items: center;
			gap: 5px;
			padding: 5px 10px;
			border-radius: 3px;
			border: none;
			background: transparent;
			color: var(--text-mid);
			font-family: var(--font-ui);
			font-size: 11px;
			cursor: pointer;
			transition: color 0.12s, background 0.12s;
			white-space: nowrap;
		}
		.bubble-btn:hover { color: var(--text); background: var(--bg-hover); }

		.bubble-icon {
			font-size: 13px;
		}

		/* ── picklist ─────────────────────────────────────── */
		#picklist {
			position: fixed;
			z-index: 110;
			min-width: 180px;
			max-width: 300px;
			padding: 4px;
			background: var(--bg-raised);
			border: 1px solid var(--border-mid);
			border-radius: var(--radius);
			box-shadow: 0 8px 24px rgba(0,0,0,0.4);
		}

		.picklist-loading {
			display: flex;
			align-items: center;
			gap: 8px;
			padding: 10px 12px;
			color: var(--text-mid);
			font-size: 11px;
		}

		.picklist-error {
			display: flex;
			flex-direction: column;
			gap: 8px;
			padding: 10px 12px;
			color: var(--sg-grammar);
			font-size: 11px;
			line-height: 1.5;
		}

		.picklist-dismiss {
			align-self: flex-end;
			padding: 2px 8px;
			border-radius: 3px;
			border: 1px solid var(--border-mid);
			background: transparent;
			color: var(--text-mid);
			font-family: var(--font-ui);
			font-size: 10px;
			cursor: pointer;
		}
		.picklist-dismiss:hover { color: var(--text); border-color: var(--text-dim); }

		.picklist-item {
			display: flex;
			align-items: baseline;
			gap: 8px;
			padding: 6px 10px;
			border-radius: 3px;
			cursor: pointer;
			transition: background 0.1s;
		}
		.picklist-item:hover { background: var(--bg-hover); }

		.picklist-synonym {
			color: var(--text);
			font-size: 12px;
			font-family: var(--font-ui);
		}

		.picklist-note {
			color: var(--text-dim);
			font-size: 10px;
			font-family: var(--font-ui);
			font-style: italic;
		}

		/* ── scrollbar ─────────────────────────────────────── */
		::-webkit-scrollbar { width: 4px; }
		::-webkit-scrollbar-track { background: transparent; }
		::-webkit-scrollbar-thumb { background: var(--border-mid); border-radius: 2px; }
		::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
	</style>
</head>
<body>

<div id="app">

	<!-- toolbar -->
	<header id="toolbar">
		<span class="wordmark">prose-ai</span>
		<div class="divider"></div>

		<div class="mode-selector">
			<button class="mode-btn active" data-mode="proofread">Proofread</button>
			<button class="mode-btn" data-mode="rewrite">Rewrite</button>
			<button class="mode-btn" data-mode="formalize">Formalize</button>
			<button class="mode-btn" data-mode="concise">Concise</button>
		</div>

		<div class="type-toggles" id="type-toggles">
			<div class="divider"></div>
			<label class="type-toggle active" data-type="grammar">
				<input type="checkbox" value="grammar" checked>
				<span class="dot"></span> grammar
			</label>
			<label class="type-toggle active" data-type="vocabulary">
				<input type="checkbox" value="vocabulary" checked>
				<span class="dot"></span> vocabulary
			</label>
			<label class="type-toggle active" data-type="clarity">
				<input type="checkbox" value="clarity" checked>
				<span class="dot"></span> clarity
			</label>
			<label class="type-toggle active" data-type="tone">
				<input type="checkbox" value="tone" checked>
				<span class="dot"></span> tone
			</label>
		</div>

		<div class="spacer"></div>

		<span id="toolbar-status"></span>
		<button id="btn-reflow">reflow</button>
		<button id="btn-cancel">cancel</button>
		<button id="btn-analyze">analyze</button>
	</header>

	<!-- editor -->
	<main id="editor-wrap">
		<div id="editor"></div>
	</main>

	<!-- sidebar -->
	<aside id="sidebar">
		<div id="sidebar-resizer"></div>
		<div id="sidebar-header">
			<h2>Suggestions</h2>
			<span id="suggestion-count">0</span>
		</div>
		<div id="sidebar-list">
			<div id="sidebar-empty">
				<div class="empty-icon">✦</div>
				<p>No suggestions yet.<br>Click analyze to get started.</p>
			</div>
		</div>
	</aside>

</div>

<!-- bubble menu (positioned by tiptap extension) -->
<div id="bubble-menu"></div>

<!-- floating tooltip -->
<div id="tooltip">
	<span id="tooltip-badge" class="sg-badge"></span>
	<p id="tooltip-explanation"></p>
	<p id="tooltip-diff" class="sg-diff"></p>
	<div id="tooltip-actions">
		<button class="sg-btn accept" id="tooltip-accept">accept</button>
		<button class="sg-btn reject" id="tooltip-reject">reject</button>
	</div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
