<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>prose-ai</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/src/css/style.css" />
</head>
<body>

<div id="app">

	<!-- toolbar -->
	<header id="toolbar">
		<span class="wordmark">prose-ai</span>
		<div class="divider"></div>

		<div class="mode-selector">
			<button class="mode-btn active" data-mode="proofread">Proofread</button>
			<button class="mode-btn" data-mode="rewrite">Rewrite</button>
			<button class="mode-btn" data-mode="formalize">Formalize</button>
			<button class="mode-btn" data-mode="concise">Concise</button>
		</div>

		<div class="type-toggles" id="type-toggles">
			<div class="divider"></div>
			<label class="type-toggle active" data-type="grammar">
				<input type="checkbox" value="grammar" checked>
				<span class="dot"></span> grammar
			</label>
			<label class="type-toggle active" data-type="vocabulary">
				<input type="checkbox" value="vocabulary" checked>
				<span class="dot"></span> vocabulary
			</label>
			<label class="type-toggle active" data-type="clarity">
				<input type="checkbox" value="clarity" checked>
				<span class="dot"></span> clarity
			</label>
			<label class="type-toggle active" data-type="tone">
				<input type="checkbox" value="tone" checked>
				<span class="dot"></span> tone
			</label>
		</div>

		<div class="spacer"></div>

		<span id="toolbar-status"></span>
		<button id="btn-undo">undo</button>
		<button id="btn-reflow">reflow</button>
		<button id="btn-cancel">cancel</button>
		<button id="btn-analyze">analyze</button>
	</header>

	<!-- editor -->
	<main id="editor-wrap">
		<div id="editor"></div>
	</main>

	<!-- sidebar -->
	<aside id="sidebar">
		<div id="sidebar-resizer"></div>
		<div id="sidebar-header">
			<h2>Suggestions</h2>
			<span id="suggestion-count">0</span>
		</div>
		<div id="sidebar-list">
			<div id="sidebar-empty">
				<div class="empty-icon">✦</div>
				<p>No suggestions yet.<br>Click analyze to get started.</p>
			</div>
		</div>
	</aside>

</div>

<!-- bubble menu (positioned by tiptap extension) -->
<div id="bubble-menu"></div>

<!-- floating tooltip -->
<div id="tooltip">
	<span id="tooltip-badge" class="sg-badge"></span>
	<p id="tooltip-explanation"></p>
	<p id="tooltip-diff" class="sg-diff"></p>
	<div id="tooltip-actions">
		<button class="sg-btn accept" id="tooltip-accept">accept</button>
		<button class="sg-btn reject" id="tooltip-reject">reject</button>
	</div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
